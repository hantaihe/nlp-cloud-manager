apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-chatbot
  namespace: nlp-cloud-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-chatbot
  template:
    metadata:
      labels:
        app: frontend-chatbot
    spec:
      containers:
        - name: frontend-chatbot
          image: nlp-cloud-manager/frontend-chatbot:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3106
          env:
            - name: PORT
              value: "3106"
            - name: HOST
              value: "0.0.0.0"
          readinessProbe:
            httpGet:
              path: /services/chatbot/
              port: 3106
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-chatbot
  namespace: nlp-cloud-manager
spec:
  selector:
    app: frontend-chatbot
  ports:
    - port: 3106
      targetPort: 3106
