apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-chatbot
  namespace: nlp-cloud-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-chatbot
  template:
    metadata:
      labels:
        app: backend-chatbot
    spec:
      containers:
        - name: backend-chatbot
          image: nlp-cloud-manager/backend-chatbot:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: nlp-config
          env:
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: nlp-db-secret
                  key: DATABASE_USERNAME
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nlp-db-secret
                  key: DATABASE_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backend-chatbot
  namespace: nlp-cloud-manager
spec:
  selector:
    app: backend-chatbot
  ports:
    - port: 8000
      targetPort: 8000
