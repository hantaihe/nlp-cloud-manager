apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-azure
  namespace: nlp-cloud-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-azure
  template:
    metadata:
      labels:
        app: backend-azure
    spec:
      containers:
        - name: backend-azure
          image: nlp-cloud-manager/backend-azure:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: nlp-config
          env:
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: nlp-db-secret
                  key: DATABASE_USERNAME
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nlp-db-secret
                  key: DATABASE_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backend-azure
  namespace: nlp-cloud-manager
spec:
  selector:
    app: backend-azure
  ports:
    - port: 8001
      targetPort: 8001
